<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apuntes Escolares</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.png" type="image/png">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .screen { display: none; width: 100%; max-width: 400px; padding: 24px; background: #1e293b; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .screen.active { display: block; }
        input, button { width: 100%; padding: 12px; margin-top: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 16px; box-sizing: border-box; }
        .btn-primary { background: #3b82f6; border: none; font-weight: bold; cursor: pointer; }
        .btn-primary:hover { background: #2563eb; }
        .toggle-auth { display: block; text-align: center; margin-top: 16px; color: #94a3b8; font-size: 14px; cursor: pointer; }
        .avatar-container { width: 80px; height: 80px; margin: 0 auto 16px; border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; position: relative; }
        .avatar-preview { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body onclick="cerrarMenuMensaje()">

    <!-- 1. PANTALLA LOGIN / REGISTRO -->
    <div id="auth-screen" class="screen active">
        <h2 id="auth-title" style="text-align: center; margin-top: 0;">Crear Perfil</h2>
        <label class="avatar-container">
            <img id="avatar-preview" class="avatar-preview" src="" alt="Foto" style="display:none;">
            <div id="avatar-placeholder" style="font-size: 24px; color: #94a3b8;">+ Foto</div>
            <input type="file" id="foto-input" accept="image/*" style="display:none;" onchange="previsualizarFoto(event)">
        </label>
        <input type="text" id="apodo" placeholder="Tu Apodo">
        <input type="password" id="clave" placeholder="Tu Contraseña">
        <button class="btn-primary" onclick="procesarAcceso()" id="auth-btn">Entrar</button>
        <span class="toggle-auth" onclick="alternarModoAuth()" id="toggle-text">¿Ya tienes cuenta? Inicia sesión</span>
    </div>

    <!-- 2. MENÚ PRINCIPAL / CHAT -->
    <div id="menu-screen" class="screen">
        <h3>Apuntes Escolares</h3>
        <div id="chat-container" style="height: 250px; overflow-y: auto; background: #0f172a; padding: 8px; border-radius: 6px; margin-bottom: 12px;"></div>
        <input type="text" id="mensaje-input" placeholder="Escribe un apunte o mensaje...">
        <button class="btn-primary" onclick="enviarMensaje()">Enviar</button>
    </div>

    <!-- MENÚ FLOTANTE PARA MENSAJES -->
    <div id="msg-context-menu" class="msg-menu" onclick="event.stopPropagation()" style="display:none; position:absolute; background:#334155; border-radius:6px; padding:4px;">
        <button onclick="menuAccionResponder()" style="background:none; border:none; color:white; padding:8px; cursor:pointer; display:block; width:100%; text-align:left;">Responder</button>
        <button id="btn-menu-borrar" onclick="menuAccionBorrar()" style="background:none; border:none; color: #ff6b6b; padding:8px; cursor:pointer; display:block; width:100%; text-align:left;">Borrar</button>
    </div>
    <!-- Librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://fjjtmdpuekghuhkgiqkh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_l9oOt9aY7iytOK0r5ZQgRg_56wZ5MPY';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let esRegistro = true;
        let usuarioActual = null;
        let amigoActual = null;
        let archivoFotoperfil = null;
        let mensajeSeleccionadoId = null;

        function alternarModoAuth() {
            esRegistro = !esRegistro;
            document.getElementById('auth-title').innerText = esRegistro ? 'Crear Perfil' : 'Iniciar Sesión';
            document.getElementById('auth-btn').innerText = esRegistro ? 'Entrar' : 'Acceder';
            document.getElementById('toggle-text').innerText = esRegistro ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate';
        }

        function previsualizarFoto(event) {
            const file = event.target.files[0];
            if (file) {
                archivoFotoperfil = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('avatar-preview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    document.getElementById('avatar-placeholder').style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        }

        function cerrarMenuMensaje() {
            const menu = document.getElementById('msg-context-menu');
            if (menu) menu.style.display = 'none';
        }

        async function procesarAcceso() {
            const apodo = document.getElementById('apodo').value.trim();
            const clave = document.getElementById('clave').value.trim();
            if (!apodo || !clave) {
                alert('Rellena todos los campos, compadre.');
                return;
            }
            // Lógica de acceso rápida simulada para evitar bloqueos
            usuarioActual = apodo;
            document.getElementById('auth-screen').classList.remove('active');
            document.getElementById('menu-screen').classList.add('active');
        }

        function enviarMensaje() {
            const input = document.getElementById('mensaje-input');
            if (!input.value.trim()) return;
            const chat = document.getElementById('chat-container');
            chat.innerHTML += `<div><b>${usuarioActual}:</b> ${input.value}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;
        }

        function menuAccionResponder() { cerrarMenuMensaje(); }
        function menuAccionBorrar() { cerrarMenuMensaje(); }
    </script>
</body>
</html>
